{% extends "base.html" %}
{% block conteudo %}
<h2>Novo evento</h2>
<form method="post">
  <p><label>Titulo</label><br><input type="text" name="titulo" required></p>
  <p><label>Descricao</label><br><textarea name="descricao" rows="4"></textarea></p>
  <p><label>Data</label><br><input type="datetime-local" name="data_evento" required></p>
  <p><button type="submit" class="btn">Adicionar</button> <a href="{{ url_for('admin_calendario') }}">Cancelar</a></p>
</form>
{% endblock %}
