{% extends "base.html" %}
{% block conteudo %}
<h2>Avisos</h2>
<table>
  <thead><tr><th>Titulo</th><th>Conteudo</th><th>Data</th><th>Autor</th></tr></thead>
  <tbody>
    {% for a in avisos %}
    <tr>
      <td>{{ a.titulo }}</td>
      <td>{{ a.conteudo }}</td>
      <td>{{ a.data_criacao }}</td>
      <td>{{ a.autor }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
