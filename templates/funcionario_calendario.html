{% extends "base.html" %}
{% block conteudo %}
<h2>Calendario</h2>
<table>
  <thead><tr><th>Titulo</th><th>Descricao</th><th>Data</th><th>Autor</th></tr></thead>
  <tbody>
    {% for e in eventos %}
    <tr>
      <td>{{ e.titulo }}</td>
      <td>{{ e.descricao }}</td>
      <td>{{ e.data_evento }}</td>
      <td>{{ e.autor }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
